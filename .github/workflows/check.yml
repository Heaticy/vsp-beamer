name: Check

on:
  push:
  pull_request:

jobs:
  beamer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and PDF audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make latexmk texlive-xetex texlive-lang-chinese texlive-latex-extra \
            fonts-noto-cjk mupdf-tools poppler-utils imagemagick jq
      - run: make release
      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsp-beamer-pdfs
          path: |
            build/**/*.pdf
            build/*.tds.tar.gz
          if-no-files-found: error
          retention-days: 14
