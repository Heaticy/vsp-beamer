stages:
  - check

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

check:
  stage: check
  tags:
    - latex-runner
  image: registry.gitlab.com/islandoftex/images/texlive:latest
  before_script:
    - apt-get update
    - apt-get install -y make fonts-noto-cjk mupdf-tools poppler-utils imagemagick jq
  script:
    - make release
  artifacts:
    name: "vsp-beamer-pdfs-$CI_COMMIT_REF_SLUG"
    paths:
      - build/**/*.pdf
      - build/*.tds.tar.gz
    expire_in: 14 days
    when: always
