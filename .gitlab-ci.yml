stages:
  - check

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

check:
  stage: check
  tags:
    - latex-runner
  before_script:
    - command -v make latexmk xelatex mutool pdfinfo pdftoppm identify jq fc-match
    - fc-match --format='%{family}\n' 'Noto Serif CJK SC' | grep -F 'Noto Serif CJK SC'
    - fc-match --format='%{family}\n' 'Noto Sans CJK SC' | grep -F 'Noto Sans CJK SC'
    - fc-match --format='%{family}\n' 'Noto Sans Mono CJK SC' | grep -F 'Noto Sans Mono CJK SC'
  script:
    - make release
  artifacts:
    name: "vsp-beamer-pdfs-$CI_COMMIT_REF_SLUG"
    paths:
      - build/**/*.pdf
      - build/*.tds.tar.gz
    expire_in: 14 days
    when: always
